name: Deploy — Staging

on:
  workflow_run:
    workflows: ["CI"]
    branches: [staging]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Simulated deploy (staging)
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Consome o artefato treinado pela CI — nao retreina (ADR-0015).
      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          pattern: model-*
          merge-multiple: true
          path: .
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show model metadata
        run: |
          META=$(find models/fraud-triage -name metadata.json | head -1)
          echo "📦 Artefato promovido para staging:"
          python -c "import json,sys; m=json.load(open('$META')); print(json.dumps({k:m[k] for k in ('version','git_sha','metrics') if k in m}, indent=2, ensure_ascii=False))"

      # Deploy simulado: sem conta em nuvem, sobe a API de verdade, consulta
      # /health e derruba. E simulacao declarada, nao deploy real (ADR-0015).
      - name: Smoke test — API health
        run: |
          python -m deploy.api &
          API_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health | tee /tmp/health.json
          kill $API_PID
          echo "✅ API respondeu em /health"

      - name: Functional demo
        run: python -m deploy.demo_faker
